<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Rhythm Hand in Hand</title>
    <style>
        /* CSS yang sudah ada */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 130, 220, 0.25), transparent 30%),
                radial-gradient(circle at bottom, rgba(98, 204, 255, 0.18), transparent 35%),
                linear-gradient(to bottom, #1a1a2e 0%, #101a31 30%, #0c1222 100%);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 52px;
            height: 52px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #4df9ff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        #game-shell {
            display: flex;
            gap: 24px;
            align-items: stretch;
            padding: 24px;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .side-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .song-card,
        .character-card,
        .lyric-card {
            background: rgba(13, 22, 40, 0.72);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.28);
            backdrop-filter: blur(8px);
        }

        .song-card {
            background: linear-gradient(135deg, rgba(88, 195, 255, 0.14), rgba(255, 109, 204, 0.08));
        }

        .song-badge {
            display: inline-block;
            padding: 6px 10px;
            background: rgba(77, 249, 255, 0.15);
            border: 1px solid rgba(77, 249, 255, 0.6);
            color: #9ef7ff;
            border-radius: 999px;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .song-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
        }

        .song-meta {
            margin-top: 12px;
            color: #dfeaff;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .character-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            background: linear-gradient(180deg, rgba(255,112,181,0.1), rgba(77,249,255,0.08));
        }

        .character-avatar {
            position: relative;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #f4d9ff, #98e8ff 30%, rgba(255,255,255,0.1) 31%, rgba(31,42,74,0.88) 37%);
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.18), 0 0 30px rgba(129,214,255,0.25);
            overflow: hidden;
        }

        .character-avatar::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 22%;
            transform: translateX(-50%);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #ffd7ee;
            box-shadow: 0 0 20px rgba(255, 209, 238, 0.5);
        }

        .character-avatar::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 12%;
            transform: translateX(-50%);
            width: 96px;
            height: 88px;
            border-radius: 18px 18px 26px 26px;
            background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(141, 228, 255, 0.7));
            box-shadow: 0 0 30px rgba(143,219,255,0.25);
        }

        .lyric-card {
            min-height: 180px;
        }

        .lyric-label {
            color: #8ad8ff;
            letter-spacing: 0.12em;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #lyric-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #f6f6ff;
            font-weight: 600;
            min-height: 100px;
            transition: all 0.2s ease;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        #game-container {
            width: min(100%, 980px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 18px 10px;
            border-radius: 28px;
            background: rgba(8, 14, 28, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 16px 36px rgba(0,0,0,0.25);
        }

        #score-board {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(6, 14, 26, 0.7);
            border-radius: 14px;
            margin-bottom: 18px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        #game-area {
            width: 92%;
            height: 430px;
            background:
                linear-gradient(to bottom, rgba(18,28,44,0.83), rgba(9,14,26,0.85)),
                radial-gradient(circle at center, rgba(86, 203, 255, 0.12), transparent 62%);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 16px rgba(255,255,255,0.05);
        }

        #game-area::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%, rgba(77,249,255,0.07));
            animation: gamePulse 3.8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes gamePulse {
            0%, 100% { opacity: 0.35; transform: scaleX(1); }
            50% { opacity: 0.75; transform: scaleX(1.02); }
        }

        .lane-glow {
            position: absolute;
            top: 0;
            width: 18%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(77, 249, 255, 0.09), rgba(255, 255, 255, 0.02));
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .lane-1 { left: 10%; }
        .lane-2 { left: 28%; }
        .lane-3 { left: 46%; }
        .lane-4 { left: 64%; }
        .lane-5 { left: 82%; }

        .hit-line {
            position: absolute;
            left: 0;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(77, 249, 255, 0.9), rgba(255,255,255,0));
            box-shadow: 0 0 12px rgba(77, 249, 255, 0.9);
        }

        .lane {
            position: absolute;
            top: 0;
            height: 100%;
            width: 18%;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .lane-1 { left: 10%; }
        .lane-2 { left: 28%; }
        .lane-3 { left: 46%; }
        .lane-4 { left: 64%; }
        .lane-5 { left: 82%; }

        .note {
            position: absolute;
            width: 44px;
            height: 16px;
            margin-left: -22px;
            background: linear-gradient(180deg, #7ae7ff, #4a8dff 60%, #6dffcc 100%);
            border-radius: 8px 8px 12px 12px;
            box-shadow: 0 0 12px rgba(74, 141, 255, 0.9), 0 0 26px rgba(122, 231, 255, 0.45);
            transform: translateX(-50%);
            top: -20px;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.08s ease;
        }

        .hold-note {
            height: 0;
            background: linear-gradient(180deg, #ff8cc5, #ff6ecf);
            box-shadow: 0 0 12px rgba(255, 134, 199, 0.8), 0 0 26px rgba(255, 104, 168, 0.42);
            border-radius: 8px;
        }

        .note-effect {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 20;
            transition: transform 0.3s ease, opacity 0.3s ease;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 70%);
        }

        #controls {
            width: 92%;
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            gap: 12px;
        }

        .key {
            width: 18%;
            min-width: 60px;
            height: 62px;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
            border: 2px solid rgba(255,255,255,0.14);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.25rem;
            transition: all 0.12s ease;
            color: #eaf7ff;
            user-select: none;
            box-shadow: inset 0 -4px 12px rgba(0,0,0,0.18);
        }

        .key.active {
            background: linear-gradient(180deg, rgba(77, 249, 255, 0.38), rgba(89, 114, 255, 0.22));
            border-color: #7ae7ff;
            transform: scale(0.96);
            box-shadow: 0 0 20px rgba(77, 249, 255, 0.45);
        }

        #touch-controls {
            display: none;
            width: 92%;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
        }

        .touch-key {
            flex: 1;
            height: 72px;
            border: 0;
            background: linear-gradient(180deg, rgba(77, 249, 255, 0.28), rgba(59, 93, 255, 0.22));
            border-radius: 16px;
            color: white;
            font-weight: 900;
            font-size: 1.3rem;
            box-shadow: 0 8px 18px rgba(77, 249, 255, 0.18);
            touch-action: manipulation;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        }

        .touch-key:active,
        .touch-key.pressed {
            transform: scale(0.96);
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(77, 249, 255, 0.4);
        }

        #judgement {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            text-shadow: 0 0 10px currentColor;
            z-index: 25;
        }

        .perfect { color: #ffeb3b; }
        .great { color: #4caf50; }
        .good { color: #2196f3; }
        .bad { color: #ff9800; }
        .miss { color: #f44336; }

        #combo-display {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: 800;
            opacity: 0;
            transition: opacity 0.25s ease;
            color: #ffeb3b;
            z-index: 25;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .start-card {
            background: rgba(11, 17, 32, 0.86);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 30px;
            padding: 36px 40px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
            width: min(900px, 90vw);
        }

        .start-card h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 0.08em;
        }

        .start-card p {
            margin: 12px 0 0;
            color: #d8e6ff;
            opacity: 0.85;
        }

        .menu-layout {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr;
            gap: 28px;
            margin-top: 24px;
            align-items: center;
        }

        #song-selection {
            display: grid;
            gap: 12px;
            text-align: left;
        }

        .song-option {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 16px 18px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .song-option.active,
        .song-option:hover {
            background: linear-gradient(90deg, rgba(77,249,255,0.18), rgba(255,110,207,0.16));
            border-color: rgba(77,249,255,0.6);
            transform: translateY(-1px);
        }

        .song-option-name {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .song-option-detail {
            color: #d9e3ff;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .character-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .character-preview {
            width: 100%;
            height: 260px;
            border-radius: 18px;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(72, 106, 255, 0.24), rgba(16, 20, 38, 0.9));
            border: 1px solid rgba(255,255,255,0.08);
        }

        model-viewer {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }

        #selected-character-name {
            font-weight: 700;
            color: #ecf5ff;
        }

        .start-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        #start-button,
        #back-button {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            padding: 15px 38px;
            font-size: 1.2rem;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
        }

        #back-button {
            background: linear-gradient(to right, #ff64e8, #00f2fe);
        }

        @media (max-width: 700px) {
            .menu-layout {
                grid-template-columns: 1fr;
            }

            .start-card {
                padding: 28px 20px;
            }
        }

        #volume-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        #volume-up, #volume-down {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #progress-container {
            width: 92%;
            height: 7px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            margin-top: 20px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4facfe, #00f2fe, #7cffd6);
            transition: width 0.1s ease;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            #game-shell {
                flex-direction: column;
                padding: 16px;
            }

            .side-panel {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }

            .song-card,
            .character-card,
            .lyric-card {
                min-height: auto;
            }

            .main-panel {
                width: 100%;
            }

            #game-container {
                width: 100%;
                padding: 12px 10px 8px;
            }
        }

        @media (max-width: 640px) {
            body {
                background:
                    radial-gradient(circle at top, rgba(88, 155, 255, 0.24), transparent 35%),
                    linear-gradient(180deg, #070b14 0%, #0d1320 100%);
            }

            #game-shell {
                padding: 10px 10px 18px;
                gap: 12px;
            }

            .side-panel {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .song-card,
            .character-card,
            .lyric-card {
                padding: 12px 12px 14px;
                border-radius: 18px;
                border-color: rgba(255,255,255,0.12);
                background: linear-gradient(180deg, rgba(15, 22, 38, 0.9), rgba(11, 18, 28, 0.8));
            }

            .song-card {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding-right: 14px;
            }

            .song-badge {
                font-size: 0.6rem;
                padding: 5px 8px;
                border-radius: 999px;
                letter-spacing: 0.14em;
            }

            .song-title {
                font-size: 1.3rem;
                letter-spacing: 0.04em;
            }

            .song-meta {
                font-size: 0.68rem;
                opacity: 0.8;
            }

            .character-card {
                min-height: 96px;
                padding: 10px;
            }

            .character-avatar {
                height: 110px;
                border-radius: 16px;
                background-size: cover;
                background-position: center;
            }

            .lyric-card {
                min-height: 90px;
            }

            .lyric-label {
                font-size: 0.62rem;
                letter-spacing: 0.15em;
            }

            #lyric-text {
                font-size: 0.82rem;
                line-height: 1.45;
                min-height: 42px;
            }

            #score-board {
                position: relative;
                top: auto;
                left: auto;
                display: flex;
                justify-content: space-between;
                gap: 8px;
                font-size: 0.72rem;
                padding: 10px 12px;
                border-radius: 14px;
                background: rgba(11, 17, 29, 0.72);
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 8px 24px rgba(11, 17, 29, 0.35);
                margin-bottom: 10px;
            }

            #game-area {
                width: 100%;
                height: 420px;
                border-radius: 20px;
                border: 1.5px solid rgba(115, 220, 255, 0.28);
                box-shadow: inset 0 0 22px rgba(77, 249, 255, 0.08), 0 12px 26px rgba(0, 0, 0, 0.28);
                overflow: hidden;
            }

            .lane {
                width: 20%;
                border-right: 1px solid rgba(255,255,255,0.1);
            }

            .lane-1 { left: 0%; }
            .lane-2 { left: 20%; }
            .lane-3 { left: 40%; }
            .lane-4 { left: 60%; }
            .lane-5 { left: 80%; }

            .hit-line {
                border-radius: 999px;
                box-shadow: 0 0 18px rgba(77, 249, 255, 0.8);
            }

            .note {
                width: 54px;
                height: 20px;
                border-radius: 10px 10px 12px 12px;
                box-shadow: 0 0 16px rgba(74, 141, 255, 0.9), 0 0 24px rgba(122, 231, 255, 0.45);
            }

            .hold-note {
                border-radius: 10px;
            }

            #controls {
                display: none;
            }

            #touch-controls {
                display: flex;
                gap: 8px;
                margin-top: 10px;
            }

            .touch-key {
                height: 64px;
                font-size: 1rem;
                border-radius: 14px;
                background: linear-gradient(180deg, rgba(91, 241, 255, 0.32), rgba(76, 99, 255, 0.18));
                border: 1px solid rgba(130, 225, 255, 0.4);
                box-shadow: inset 0 -4px 12px rgba(0,0,0,0.18), 0 8px 18px rgba(77, 249, 255, 0.18);
            }

            .touch-key:active,
            .touch-key.pressed {
                transform: translateY(1px) scale(0.98);
                filter: brightness(1.2);
                box-shadow: 0 0 18px rgba(77, 249, 255, 0.28);
            }

            #progress-container {
                width: 100%;
                height: 8px;
                margin-top: 12px;
                border-radius: 999px;
            }

            #judgement {
                top: 44%;
                font-size: 2.2rem;
            }

            #combo-display {
                top: 34%;
                font-size: 1.5rem;
            }

            #volume-controls {
                top: 12px;
                right: 12px;
                transform: scale(0.9);
                transform-origin: top right;
            }

            #volume-up, #volume-down {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: rgba(12, 20, 32, 0.8);
                border: 1px solid rgba(255,255,255,0.12);
                box-shadow: 0 8px 18px rgba(0,0,0,0.24);
            }

            .start-card {
                padding: 22px 16px;
                border-radius: 24px;
                border-color: rgba(130, 225, 255, 0.2);
                background: rgba(9, 15, 25, 0.9);
                box-shadow: 0 20px 50px rgba(0,0,0,0.42);
            }

            .start-card h1 {
                font-size: 2rem;
                letter-spacing: 0.08em;
            }

            .start-card p {
                font-size: 0.82rem;
            }

            .menu-layout {
                grid-template-columns: 1fr;
                gap: 18px;
                margin-top: 18px;
            }

            #song-selection {
                gap: 10px;
            }

            .song-option {
                padding: 12px 14px;
                border-radius: 14px;
            }

            .song-option-name {
                font-size: 1rem;
            }

            .song-option-detail {
                font-size: 0.72rem;
            }

            .character-panel {
                padding: 12px;
                border-radius: 18px;
            }

            .character-preview {
                height: 180px;
                border-radius: 14px;
            }

            .start-actions {
                flex-direction: column;
                gap: 12px;
                margin-top: 20px;
            }

            #start-button,
            #back-button {
                width: 100%;
                min-width: 0;
                padding: 13px 18px;
                font-size: 1rem;
                border-radius: 999px;
            }
        }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="loader"></div>
    </div>
    
    <audio id="music" loop preload="auto">
        <source src="assets/music/Hand_in_Hand_Magical_Mirai.m4a" type="audio/mpeg">
    </audio>
    
    <div id="game-shell">
        <aside class="side-panel">
            <div class="song-card">
                <div class="song-badge">Live</div>
                <h2 class="song-title">Hand in Hand</h2>
                <div class="song-meta">Difficulty 13 • 5 lane • 4k style</div>
            </div>

    <script>

                ],
                lyricTimeline: [
                    { time: 1000, text: 'In the morning light, we sing together' },
                    { time: 3500, text: 'Our voices become one dream' },
                    { time: 6500, text: 'Even the lonely night can shine' },

                    { time: 21000, text: 'One step, one breath, forever' },

                    { time: 29000, text: 'Smile with me, we are never alone' },
                    { time: 33000, text: 'This feeling will stay with us' }
                ]
            },
            {
                id: 'miku-showtime',
                title: 'Soon to be Released',
                difficulty: '-',
                character: 'Miku Expo',
                model: 'model/rigged-miku.glb',
                music: 'assets/music/#',
                duration: 40000,
                notes: [

                lyricTimeline: [

            }
        ];

        const notes = [];
        const PLAY_LIMIT_MS = 120000;

        let selectedSongId = 'hand-in-hand';
        let currentSong = songs[0];
        let activeNotesData = [...currentSong.notes];
        let lyricTimeline = [...currentSong.lyricTimeline];

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let currentNote = 0;
        let gameStarted = false;
        let startTime = 0;
        let activeNotes = [];
        let songDuration = 35000;
        let animationFrameId = null;
        let keyState = {};
        let musicVolume = 0.7;
        let lastBeatPulse = -1;

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function getLaneX(laneNumber) {
            const laneIndex = laneNumber - 1;
            return 10 + laneIndex * 18 + 7;
        }

        function getCurrentSongTime() {
            const music = document.getElementById('music');
            if (music && Number.isFinite(music.currentTime) && music.duration > 0) {
                return music.currentTime * 1000;
            }
            return performance.now() - startTime;
        }

        function pulseBeatGlow() {
            const beatIndex = Math.floor(getCurrentSongTime() / 500) % 5;
            if (beatIndex === lastBeatPulse) return;
            lastBeatPulse = beatIndex;

            const laneGlow = document.querySelector(`.lane-glow.lane-${beatIndex + 1}`);
            if (laneGlow) {
                laneGlow.style.opacity = '0.95';
                setTimeout(() => {
                    laneGlow.style.opacity = '0';
                }, 110);
            }
        }

        function getNoteY(currentGameTime, noteTime) {
            const startY = -30;
            const endY = HIT_LINE_Y;
            const progress = clamp((currentGameTime - (noteTime - NOTE_TRAVEL_MS)) / NOTE_TRAVEL_MS, 0, 1);
            return startY + progress * (endY - startY);
        }

        function createNote(noteData) {
            const note = document.createElement('div');
            note.className = 'note';
            note.style.left = `${getLaneX(noteData.lane)}%`;
            note.style.top = '-30px';

            if (noteData.duration > 0) {
                note.classList.add('hold-note');
                note.style.height = `${Math.max(18, (noteData.duration / 1000) * 180)}px`;
            }

            note.dataset.time = String(noteData.time);
            note.dataset.lane = String(noteData.lane);
            note.dataset.duration = String(noteData.duration);
            note.addEventListener('click', () => handleNoteClick(note));

            document.getElementById('game-area').appendChild(note);

            activeNotes.push({
                id: `${noteData.time}-${noteData.lane}-${performance.now()}`,
                element: note,
                time: noteData.time,
                lane: noteData.lane,
                duration: noteData.duration,
                hit: false,
                judged: false
            });

            return note;
        }

        function createNoteEffect(x, y, color) {
            const effect = document.createElement('div');
            effect.className = 'note-effect';
            effect.style.left = `${x - 40}px`;
            effect.style.top = `${y - 40}px`;
            effect.style.background = `radial-gradient(circle, ${color} 0%, rgba(255,255,255,0) 70%)`;
            document.getElementById('game-area').appendChild(effect);

            setTimeout(() => {
                effect.style.transform = 'scale(1.5)';
                effect.style.opacity = '0.8';
            }, 10);

            setTimeout(() => {
                effect.style.transform = 'scale(2.5)';
                effect.style.opacity = '0';
                setTimeout(() => effect.remove(), 300);
            }, 120);
        }

        function updateScore() {
            document.getElementById('score-display').textContent = score.toLocaleString();
        }

        function showJudgement(judgement, judgementClass) {
            const judgementEl = document.getElementById('judgement');
            const comboEl = document.getElementById('combo-display');

            judgementEl.textContent = judgement;
            judgementEl.className = judgementClass;
            judgementEl.style.opacity = '1';
            judgementEl.style.transform = 'translateX(-50%) scale(1.2)';

            if (combo > 0) {
                comboEl.textContent = `${combo} COMBO!`;
                comboEl.style.opacity = '1';
            } else {
                comboEl.style.opacity = '0';
            }

            document.getElementById('combo-value').textContent = combo;
            document.getElementById('max-combo').textContent = maxCombo;

            setTimeout(() => {
                judgementEl.style.opacity = '0';
                judgementEl.style.transform = 'translateX(-50%) scale(1)';
                if (combo === 0) {
                    comboEl.style.opacity = '0';
                }
            }, 500);
        }

        function resolveJudgement(diff) {
            if (diff <= JUDGEMENT_WINDOWS.perfect) return { name: 'PERFECT', className: 'perfect', points: 300 };
            if (diff <= JUDGEMENT_WINDOWS.great) return { name: 'GREAT', className: 'great', points: 200 };
            if (diff <= JUDGEMENT_WINDOWS.good) return { name: 'GOOD', className: 'good', points: 100 };
            if (diff <= JUDGEMENT_WINDOWS.bad) return { name: 'BAD', className: 'bad', points: 50 };
            return null;
        }

        function animateNoteRemoval(note) {
            note.style.transform = 'scale(1.15)';
            note.style.opacity = '0';
            setTimeout(() => {
                if (note.parentNode) {
                    note.remove();
                }
            }, 150);
        }

        function handleNoteClick(noteElement) {
            if (!gameStarted) return;

            const lane = Number(noteElement.dataset.lane);
            const noteTime = Number(noteElement.dataset.time);
            const currentGameTime = getCurrentSongTime();
            const diff = Math.abs(currentGameTime - noteTime);
            const result = resolveJudgement(diff);

            if (!result || diff > MISS_WINDOW_MS) {
                return;
            }

            const matchingNote = activeNotes.find((n) => n.element === noteElement && !n.hit);
            if (!matchingNote) return;

            matchingNote.hit = true;
            matchingNote.judged = true;

            if (result.name === 'BAD') {
                combo = 0;
            } else {
                combo += 1;
            }

            if (combo > maxCombo) maxCombo = combo;
            score += result.points;
            updateScore();
            showJudgement(result.name, result.className);

            const rect = noteElement.getBoundingClientRect();
            const areaRect = document.getElementById('game-area').getBoundingClientRect();
            const x = rect.left - areaRect.left + rect.width / 2;
            const y = rect.top - areaRect.top + rect.height / 2;
            createNoteEffect(x, y, '#4df9ff');
            animateNoteRemoval(noteElement);
        }

        function registerMiss(note) {
            if (note.hit) return;
            note.hit = true;
            combo = 0;
            document.getElementById('combo-value').textContent = '0';
            showJudgement('MISS', 'miss');
            if (note.element.parentNode) {
                animateNoteRemoval(note.element);
            }
        }

        function spawnNotes() {
            if (!gameStarted) return;

            const currentGameTime = getCurrentSongTime();
            while (currentNote < notes.length && notes[currentNote].time <= currentGameTime + PREVIEW_MS) {
                const nextNote = notes[currentNote];
                const duplicate = activeNotes.some((n) => n.time === nextNote.time && n.lane === nextNote.lane && !n.hit);
                if (!duplicate) {
                    createNote(nextNote);
                }
                currentNote += 1;
            }
        }

        function updateActiveNotes() {
            const currentGameTime = getCurrentSongTime();

            activeNotes.forEach((note) => {
                if (note.hit) return;

                const noteElement = note.element;
                noteElement.style.top = `${getNoteY(currentGameTime, note.time)}px`;

                const laneGlow = document.querySelector(`.lane-glow.lane-${note.lane}`);
                if (laneGlow) {
                    const diff = Math.abs(currentGameTime - note.time);
                    if (diff < 250) {
                        laneGlow.style.opacity = '0.9';
                        setTimeout(() => {
                            laneGlow.style.opacity = '0';
                        }, 80);
                    }
                }

                const diff = currentGameTime - note.time;
                if (diff > MISS_WINDOW_MS) {
                    registerMiss(note);
                }
            });

            activeNotes = activeNotes.filter((note) => !note.hit);
        }

        function updateLyrics() {
            const currentGameTime = getCurrentSongTime();
            let activeLyric = 'Ready to start the song...';

            for (let i = lyricTimeline.length - 1; i >= 0; i--) {
                if (currentGameTime >= lyricTimeline[i].time) {
                    activeLyric = lyricTimeline[i].text;
                    break;
                }
            }

            document.getElementById('lyric-text').textContent = activeLyric;
        }

        function setSongSelection(songId) {
            selectedSongId = songId;
            currentSong = songs.find((song) => song.id === songId) || songs[0];
            activeNotesData = [...currentSong.notes];
            lyricTimeline = [...currentSong.lyricTimeline];

            const viewer = document.getElementById('character-viewer');
            if (viewer) {
                viewer.src = currentSong.model;
            }

            document.getElementById('selected-character-name').textContent = currentSong.character;
            document.querySelector('.song-title').textContent = currentSong.title;
            document.querySelector('.song-meta').textContent = `Difficulty ${currentSong.difficulty} • 5 lane • 4k style`;
            const music = document.getElementById('music');
            if (music) {
                const targetSrc = currentSong.music;
                if (music.dataset.songSrc !== targetSrc) {
                    music.pause();
                    music.currentTime = 0;
                    music.src = targetSrc;
                    music.dataset.songSrc = targetSrc;
                    music.load();
                }
                music.volume = musicVolume;
            }
        }

        function seekSongToTime(targetMs) {
            if (!gameStarted) return;

            const clampedMs = clamp(targetMs, 0, PLAY_LIMIT_MS);
            const music = document.getElementById('music');
            if (music) {
                music.currentTime = clamp(clampedMs / 1000, 0, Math.max(0, Math.min((music.duration || 0), PLAY_LIMIT_MS / 1000)));
            }

            startTime = performance.now() - clampedMs;
            currentNote = 0;
            while (currentNote < notes.length && notes[currentNote].time < clampedMs) {
                currentNote += 1;
            }

            activeNotes = [];
            const gameArea = document.getElementById('game-area');
            if (gameArea) {
                gameArea.querySelectorAll('.note, .note-effect').forEach((el) => el.remove());
            }

            spawnNotes();
        }

        function startGame() {
            const selectedSong = songs.find((song) => song.id === selectedSongId) || songs[0];
            currentSong = selectedSong;
            activeNotesData = [...currentSong.notes];
            lyricTimeline = [...currentSong.lyricTimeline];

            document.getElementById('start-screen').style.display = 'none';

            score = 0;
            combo = 0;
            maxCombo = 0;
            currentNote = 0;
            gameStarted = true;
            startTime = performance.now();
            activeNotes = [];
            notes.length = 0;
            notes.push(...currentSong.notes);
            songDuration = Math.min(currentSong.duration, PLAY_LIMIT_MS);
            lastBeatPulse = -1;

            const gameArea = document.getElementById('game-area');
            gameArea.querySelectorAll('.note, .note-effect').forEach((el) => el.remove());

            updateScore();
            document.getElementById('combo-value').textContent = '0';
            document.getElementById('max-combo').textContent = '0';
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('combo-display').textContent = '0';
            document.getElementById('combo-display').style.opacity = '0';

            const music = document.getElementById('music');
            if (music) {
                const targetSrc = currentSong.music;
                if (music.dataset.songSrc !== targetSrc) {
                    music.src = targetSrc;
                    music.dataset.songSrc = targetSrc;
                    music.load();
                }
                music.pause();
                music.currentTime = 0;
                music.volume = musicVolume;
                music.play().catch(() => {
                    console.log('Audio play failed, continuing without sound.');
                });
            }

            spawnNotes();
            gameLoop();
        }

        function gameLoop() {
            if (!gameStarted) return;

            const currentGameTime = getCurrentSongTime();
            const effectiveDuration = Math.min(songDuration, PLAY_LIMIT_MS);
            const progress = Math.min(100, (currentGameTime / effectiveDuration) * 100);
            document.getElementById('progress-bar').style.width = `${progress}%`;
            pulseBeatGlow();

            spawnNotes();
            updateActiveNotes();
            updateLyrics();

            const music = document.getElementById('music');
            if (music && music.currentTime >= effectiveDuration / 1000) {
                music.pause();
            }

            if (currentGameTime >= effectiveDuration && activeNotes.length === 0) {
                endGame();
                return;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameStarted = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            const music = document.getElementById('music');
            if (music) {
                music.pause();
            }

            const accuracy = notes.length > 0 ? Math.round((score / (notes.length * 300)) * 100) : 0;

            setTimeout(() => {
                const resultScreen = document.createElement('div');
                resultScreen.style.position = 'fixed';
                resultScreen.style.top = '0';
                resultScreen.style.left = '0';
                resultScreen.style.width = '100%';
                resultScreen.style.height = '100%';
                resultScreen.style.background = 'rgba(0, 0, 0, 0.9)';
                resultScreen.style.display = 'flex';
                resultScreen.style.flexDirection = 'column';
                resultScreen.style.justifyContent = 'center';
                resultScreen.style.alignItems = 'center';
                resultScreen.style.zIndex = '1000';
                resultScreen.style.color = 'white';

                resultScreen.innerHTML = `
                    <h2 style="font-size: 3rem; margin-bottom: 30px; color: #4df9ff;">Song Complete!</h2>
                    <div style="font-size: 1.5rem; margin-bottom: 15px;">Final Score: ${score.toLocaleString()}</div>
                    <div style="font-size: 1.5rem; margin-bottom: 15px;">Max Combo: ${maxCombo}</div>
                    <div style="font-size: 1.5rem; margin-bottom: 30px;">Accuracy: ${accuracy}%</div>
                    <button id="restart-button" style="background: linear-gradient(to right, #4facfe, #00f2fe); border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; color: white; cursor: pointer;">Play Again</button>
                `;

                document.body.appendChild(resultScreen);

                document.getElementById('restart-button').addEventListener('click', () => {
                    resultScreen.remove();
                    document.getElementById('start-screen').style.display = 'flex';
                });
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const songSelectionContainer = document.getElementById('song-selection');
            songs.forEach((song) => {
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'song-option';
                if (song.id === selectedSongId) option.classList.add('active');
                option.innerHTML = `
                    <div>
                        <div class="song-option-name">${song.title}</div>
                        <div class="song-option-detail">${song.character} • Lv.${song.difficulty}</div>
                    </div>
                    <div class="song-option-detail">${song.notes.length} notes</div>
                `;
                option.addEventListener('click', () => {
                    document.querySelectorAll('.song-option').forEach((item) => item.classList.remove('active'));
                    option.classList.add('active');
                    setSongSelection(song.id);
                });
                songSelectionContainer.appendChild(option);
            });

            setSongSelection(selectedSongId);
            document.getElementById('start-button').addEventListener('click', startGame);

            const progressContainer = document.getElementById('progress-container');
            progressContainer.addEventListener('click', (event) => {
                if (!gameStarted) return;

                const rect = progressContainer.getBoundingClientRect();
                const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
                const targetMs = ratio * songDuration;

                seekSongToTime(targetMs);
            });

            document.getElementById('volume-up').addEventListener('click', () => {
                musicVolume = Math.min(1, musicVolume + 0.1);
                const music = document.getElementById('music');
                if (music) music.volume = musicVolume;
            });

            document.getElementById('volume-down').addEventListener('click', () => {
                musicVolume = Math.max(0, musicVolume - 0.1);
                const music = document.getElementById('music');
                if (music) music.volume = musicVolume;
            });

            document.querySelectorAll('.touch-key').forEach((button) => {
                const lane = Number(button.dataset.lane);
                button.addEventListener('pointerdown', (event) => {
                    event.preventDefault();
                    if (!gameStarted) return;
                    const currentGameTime = getCurrentSongTime();
                    const closestNote = activeNotes
                        .filter((n) => !n.hit && n.lane === lane)
                        .sort((a, b) => Math.abs(a.time - currentGameTime) - Math.abs(b.time - currentGameTime))[0];

                    if (closestNote) {
                        const diff = Math.abs(currentGameTime - closestNote.time);
                        if (diff <= MISS_WINDOW_MS) {
                            handleNoteClick(closestNote.element);
                        }
                    }

                    button.classList.add('pressed');
                    setTimeout(() => button.classList.remove('pressed'), 120);
                });
            });

            document.addEventListener('keydown', (event) => {
                if (!gameStarted) return;

                const key = event.key.toLowerCase();
                if (keyState[key]) return;
                keyState[key] = true;

                const keyMap = { d: 1, f: 2, ' ': 3, j: 4, k: 5 };
                const lane = keyMap[key] || keyMap[event.code === 'Space' ? ' ' : ''];
                if (!lane) return;

                const keys = document.querySelectorAll('.key');
                keys[lane - 1].classList.add('active');

                const currentGameTime = getCurrentSongTime();
                const closestNote = activeNotes
                    .filter((n) => !n.hit && n.lane === lane)
                    .sort((a, b) => Math.abs(a.time - currentGameTime) - Math.abs(b.time - currentGameTime))[0];

                if (closestNote) {
                    const diff = Math.abs(currentGameTime - closestNote.time);
                    if (diff <= MISS_WINDOW_MS) {
                        handleNoteClick(closestNote.element);
                    }
                }
            });

            document.addEventListener('keyup', (event) => {
                const key = event.key.toLowerCase();
                keyState[key] = false;

                const keys = document.querySelectorAll('.key');
                keys.forEach((keyEl) => keyEl.classList.remove('active'));
            });
        });
    </script>
</body>
</html>
